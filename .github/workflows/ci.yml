name: Payment Service CI/CD

on:
  push:
    branches:
      - main



# Required for GitHub OIDC authentication
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: payment-service

jobs:

  build-and-push:

    name: Build Java Application and Push Docker Image to ECR
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Java
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # --------------------------------------------------
      # 3. Build Spring Boot application
      # --------------------------------------------------
      - name: Build application
        run: |
          mvn clean package -DskipTests

      # --------------------------------------------------
      # . actions-oidc- debug
      # --------------------------------------------------
      - name: Debug GitHub OIDC claims
        uses: github/actions-oidc-debugger@main
        with:
         audience: sts.amazonaws.com

      # --------------------------------------------------
      # 4. Configure AWS credentials using GitHub OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::891612582525:role/GitHubActionsDeploymentRole
          aws-region: us-east-1


      # --------------------------------------------------
      # 5. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------
      # 6. Build Docker image
      # --------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            .


      # --------------------------------------------------
      # 7. Push Docker image to ECR
      # --------------------------------------------------
      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}


      # --------------------------------------------------
      # 8. Also tag image as latest
      # --------------------------------------------------
      - name: Tag image as latest
        run: |
          docker tag \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest


      # --------------------------------------------------
      # 9. Push latest tag
      # --------------------------------------------------
      - name: Push latest image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest