name: Payment Service CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: payment-service
  ECS_CLUSTER: payment-cluster
  ECS_SERVICE: payment-service
  ECS_TASK_DEFINITION: payment-service-task
  CONTAINER_NAME: payment-service

jobs:
  build-and-deploy:
    name: Build, Push and Deploy to ECS
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # --------------------------------------------------
      # 3. Build Spring Boot application
      # --------------------------------------------------
      - name: Build application
        run: |
          mvn clean package -DskipTests

      # --------------------------------------------------
      # 4. Display GitHub information
      # --------------------------------------------------
      - name: Show GitHub information
        run: |
          echo "========================================"
          echo "GitHub Repository : $GITHUB_REPOSITORY"
          echo "GitHub Branch     : $GITHUB_REF"
          echo "GitHub Event      : $GITHUB_EVENT_NAME"
          echo "GitHub Actor      : $GITHUB_ACTOR"
          echo "Git Commit SHA    : $GITHUB_SHA"
          echo "========================================"

      # --------------------------------------------------
      # 5. Get and inspect OIDC claims
      # --------------------------------------------------
      - name: Check GitHub OIDC claims
        shell: bash
        run: |
          echo "Requesting GitHub OIDC token..."

          TOKEN_RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: GitHub OIDC token was not generated."
            exit 1
          fi

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          # Add Base64 padding if necessary
          PADDING=$((4 - ${#PAYLOAD} % 4))

          if [ "$PADDING" -ne 4 ]; then
            PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $PADDING))"
          fi

          DECODED_PAYLOAD=$(echo "$PAYLOAD" | base64 -d 2>/dev/null)

          echo ""
          echo "========================================"
          echo "GitHub OIDC Claims"
          echo "========================================"

          echo "OIDC subject (sub):"
          echo "$DECODED_PAYLOAD" | jq -r '.sub'

          echo ""
          echo "OIDC audience (aud):"
          echo "$DECODED_PAYLOAD" | jq -r '.aud'

          echo ""
          echo "Repository:"
          echo "$DECODED_PAYLOAD" | jq -r '.repository'

          echo ""
          echo "Repository owner:"
          echo "$DECODED_PAYLOAD" | jq -r '.repository_owner'

          echo ""
          echo "Ref:"
          echo "$DECODED_PAYLOAD" | jq -r '.ref'

          echo ""
          echo "========================================"

      # --------------------------------------------------
      # 6. Configure AWS credentials using GitHub OIDC
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::891612582525:role/GitHubActionsDeploymentRole
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------
      # 7. Verify AWS authentication
      # --------------------------------------------------
      - name: Verify AWS identity
        run: |
          echo "AWS Identity:"
          aws sts get-caller-identity

      # --------------------------------------------------
      # 8. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # 9. Set ECR image
      # --------------------------------------------------
      - name: Set image URI
        id: image
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${GITHUB_SHA}"

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Docker Image:"
          echo "$IMAGE_URI"
          echo "========================================"

      # --------------------------------------------------
      # 10. Build Docker image
      # --------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_URI" \
            .

      # --------------------------------------------------
      # 11. Push SHA-tagged image to ECR
      # --------------------------------------------------
      - name: Push Docker image to ECR
        run: |
          docker push "$IMAGE_URI"

      # --------------------------------------------------
      # 12. Download current ECS task definition
      # --------------------------------------------------
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > task-definition.json

          echo "Current task definition downloaded."

      # --------------------------------------------------
      # 13. Create new task definition with new image
      # --------------------------------------------------
      - name: Render new task definition
        run: |
          jq \
            --arg IMAGE "$IMAGE_URI" \
            --arg CONTAINER "$CONTAINER_NAME" \
            '
            .containerDefinitions |=
              map(
                if .name == $CONTAINER
                then .image = $IMAGE
                else .
                end
              )
            |
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            ' \
            task-definition.json > new-task-definition.json

          echo "New task definition prepared."

      # --------------------------------------------------
      # 14. Register new ECS task definition revision
      # --------------------------------------------------
      - name: Register new ECS task definition
        id: register-task
        run: |
          NEW_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "NEW_TASK_DEFINITION=$NEW_TASK_DEFINITION" >> "$GITHUB_ENV"

          echo "========================================"
          echo "New Task Definition:"
          echo "$NEW_TASK_DEFINITION"
          echo "========================================"

      # --------------------------------------------------
      # 15. Update ECS service
      # --------------------------------------------------
      - name: Deploy to ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_DEFINITION"

          echo "ECS service deployment started."

      # --------------------------------------------------
      # 16. Wait for ECS service to become stable
      # --------------------------------------------------
      - name: Wait for ECS deployment
        run: |
          echo "Waiting for ECS service to become stable..."

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "========================================"
          echo "ECS deployment completed successfully."
          echo "========================================"